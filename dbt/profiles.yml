# Local run: DuckDB (default). To run on Snowflake, set target: snowflake
# and export the SNOWFLAKE_* environment variables.
olist_analytics:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ../data/warehouse.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'OLIST') }}"
      schema: analytics
      threads: 4
