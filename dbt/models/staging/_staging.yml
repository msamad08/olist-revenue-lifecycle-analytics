version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: item_price
        data_tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_leads
    columns:
      - name: mql_id
        data_tests: [unique, not_null]
  - name: stg_closed_deals
    columns:
      - name: mql_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_leads')
                field: mql_id
